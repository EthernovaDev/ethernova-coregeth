name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build dist (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Build dist (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          scripts/build-dist.ps1 -Version "${{ github.ref_name }}" -WindowsOnly

      - name: Build dist (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x scripts/build-dist.sh
          ./scripts/build-dist.sh "${{ github.ref_name }}"

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/ethernova-windows-amd64-${{ github.ref_name }}.zip

      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/ethernova-linux-amd64-${{ github.ref_name }}.tar.gz

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release
          cp "dist/dist-windows/ethernova-windows-amd64-${{ github.ref_name }}.zip" release/
          cp "dist/dist-linux/ethernova-linux-amd64-${{ github.ref_name }}.tar.gz" release/
          sha256sum release/* > release/checksums-sha256.txt
          release_doc="RELEASE_${{ github.ref_name }}.md"
          notes_doc="RELEASE_NOTES_${{ github.ref_name }}.md"
          upgrade_doc="docs/UPGRADE_RUNBOOK_${{ github.ref_name }}.md"
          if [[ -f "$release_doc" ]]; then
            cp "$release_doc" release/
          fi
          if [[ -f "$notes_doc" ]]; then
            cp "$notes_doc" release/
          fi
          if [[ -f "$upgrade_doc" ]]; then
            cp "$upgrade_doc" release/
          fi

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            release/ethernova-windows-amd64-${{ github.ref_name }}.zip
            release/ethernova-linux-amd64-${{ github.ref_name }}.tar.gz
            release/checksums-sha256.txt
            release/RELEASE_${{ github.ref_name }}.md
            release/RELEASE_NOTES_${{ github.ref_name }}.md
            release/UPGRADE_RUNBOOK_${{ github.ref_name }}.md
